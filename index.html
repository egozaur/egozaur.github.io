<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0B09">
<meta name="robots" content="noindex">
<title>PL3Y</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="apple-mobile-web-app-title" content="PL3Y">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script src="/auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0C0B09;
    --glow: #1C1813;
    --gold: #C9A85C;
    --gold-hi: #E3C77F;
    --text: #EFE8D8;
    --muted: #A39C8C;
    --red: #B9463B;
    --blue: #3E6AA8;
    --neutral: #2A2620;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.22, .8, .24, 1);
    --dur: .6s;
    /* szerokość aktywnej karty: ~360 px na dużym ekranie, ~250 px na telefonie */
    --cw: clamp(190px, min(66vw, calc((100vh - 290px) * .72)), 360px);
    --ch: calc(var(--cw) * 1.39);
  }
  @supports (height: 100svh) {
    :root { --cw: clamp(190px, min(66vw, calc((100svh - 290px) * .72)), 360px); }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: var(--bg) radial-gradient(ellipse 70% 60% at 50% 48%, var(--glow) 0%, var(--bg) 70%) no-repeat fixed;
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 4px; }
  .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }

  /* ---------- znak ---------- */
  .brand {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin: 0; padding: max(28px, env(safe-area-inset-top)) 16px 0;
    font-weight: normal;
  }
  .brand-mark {
    display: block; width: 40px; height: 40px;
    filter: drop-shadow(0 0 10px rgba(233, 196, 106, .35));
  }
  .brand-name { font: 500 13px/1 var(--mono); letter-spacing: .42em; color: var(--text); margin-right: -.42em; }

  main {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px 0 max(28px, env(safe-area-inset-bottom));
    transition: opacity .25s ease;
  }
  body.leaving main { opacity: 0; }

  /* ---------- karuzela ---------- */
  .stage {
    width: 100%;
    overflow: hidden;
    padding: 44px 0;
    touch-action: pan-y;
  }
  .track {
    position: relative;
    height: var(--ch);
    perspective: 1600px;
    transform-style: preserve-3d;
  }
  .card {
    --x: 0; --a: 0; --ry: 0deg; --s: 1; --o: 1;
    position: absolute; left: 50%; top: 50%;
    width: var(--cw); height: var(--ch);
    margin: 0; padding: calc(var(--cw) * .072);
    display: flex; flex-direction: column; align-items: stretch;
    text-align: left;
    background: linear-gradient(165deg, #1B1814 0%, #13110E 55%, #0F0E0B 100%);
    border: 1px solid rgba(201, 168, 92, .22);
    border-radius: 16px;
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .7);
    cursor: pointer;
    opacity: var(--o);
    z-index: calc(10 - var(--a));
    transform:
      translate(-50%, -50%)
      translateX(calc(var(--x) * var(--cw)))
      translateZ(calc(var(--a) * -70px))
      rotateY(var(--ry))
      scale(var(--s));
    transition:
      transform var(--dur) var(--ease),
      opacity var(--dur) var(--ease),
      filter var(--dur) var(--ease),
      border-color var(--dur) var(--ease),
      box-shadow var(--dur) var(--ease),
      visibility 0s linear 0s;
    -webkit-tap-highlight-color: transparent;
  }
  .card[data-pos="1"] { filter: brightness(.62) saturate(.5); }
  .card[data-pos="2"] { filter: brightness(.5) saturate(.3); }
  .card[data-pos="3"] {
    visibility: hidden; pointer-events: none;
    transition-property: transform, opacity, filter, border-color, box-shadow, visibility;
    transition-delay: 0s, 0s, 0s, 0s, 0s, var(--dur);
  }
  .card.is-active {
    border-color: var(--gold);
    box-shadow:
      0 0 0 1px rgba(201, 168, 92, .25),
      0 0 60px -6px rgba(201, 168, 92, .32),
      0 40px 80px -24px rgba(0, 0, 0, .85);
  }
  .card:not(.is-active):hover { border-color: rgba(201, 168, 92, .5); }
  .card:focus-visible { outline-offset: 6px; border-radius: 16px; }

  .card.soon {
    background: linear-gradient(165deg, #16130F 0%, #100E0B 100%);
    border: 1.5px dashed rgba(201, 168, 92, .3);
  }
  .card.soon.is-active {
    border-color: rgba(201, 168, 92, .85);
    box-shadow: 0 0 50px -10px rgba(201, 168, 92, .22), 0 40px 80px -24px rgba(0, 0, 0, .85);
  }

  .card-top {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    font: 500 max(9.5px, calc(var(--cw) * .03))/1 var(--mono);
    letter-spacing: .22em; text-transform: uppercase;
  }
  .card-no { color: var(--muted); }
  .card-tag { color: var(--gold); text-align: right; }
  .card-art { flex: 1; display: grid; place-items: center; min-height: 0; }
  .card-title {
    display: block;
    font: 600 calc(var(--cw) * .135)/1 var(--serif);
    letter-spacing: .005em;
    color: var(--text);
    padding-top: calc(var(--cw) * .045);
    border-top: 1px solid rgba(201, 168, 92, .16);
  }
  .card.soon .card-title { color: var(--muted); }

  /* miniatura planszy Tajniaków */
  .board {
    width: 66%;
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: calc(var(--cw) * .016);
    padding: calc(var(--cw) * .03);
    background: rgba(0, 0, 0, .3);
    border: 1px solid rgba(201, 168, 92, .14);
    border-radius: 10px;
  }
  .sq {
    display: block; aspect-ratio: 1; border-radius: 3px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), inset 0 -2px 3px rgba(0, 0, 0, .25);
  }
  .sq.r { background: var(--red); }
  .sq.b { background: var(--blue); }
  .sq.n { background: var(--neutral); }
  .sq.a { background: #070605; box-shadow: inset 0 0 0 1.5px var(--gold), 0 0 8px rgba(201, 168, 92, .35); }

  /* miniatura Mafii: wachlarz kart roli */
  .dossier { position: relative; width: 62%; aspect-ratio: 1; display: block; }
  .dc {
    position: absolute; left: 50%; top: 50%; width: 52%; aspect-ratio: .72; border-radius: 8px;
    background: linear-gradient(165deg, #241F18, #14110D);
    border: 1px solid rgba(201, 168, 92, .45);
    box-shadow: 0 12px 24px -10px rgba(0, 0, 0, .8);
    transform-origin: 50% 120%;
  }
  .dc.l { transform: translate(-50%, -50%) rotate(-16deg); }
  .dc.r { transform: translate(-50%, -50%) rotate(16deg); }
  .dc.m { transform: translate(-50%, -50%); display: grid; place-items: center; border-color: var(--red); }
  .seal.mini { width: 62%; transform: rotate(-8deg); }
  .seal.mini .seal-p { font-size: calc(var(--cw) * .1); }

  /* miniatura Miliona: drabinka kwot z podświetlonym szczeblem */
  .ladder { width: 64%; display: flex; flex-direction: column-reverse; gap: calc(var(--cw) * .014); }
  .ladder i {
    display: block; height: calc(var(--cw) * .034); border-radius: 99px;
    background: rgba(201, 168, 92, .16); border: 1px solid rgba(201, 168, 92, .22);
  }
  .ladder i:nth-child(2n) { width: 86%; align-self: flex-end; }
  .ladder i.on { background: linear-gradient(90deg, #8a6a24, var(--gold), #8a6a24); box-shadow: 0 0 10px rgba(201, 168, 92, .45); }
  .ladder i.top { border-color: var(--gold); }

  /* miniatura z pliku img/*.webp; gdy pliku brak, img znika i zostaje miniatura z CSS */
  .thumb { display: block; width: 66%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; }
  .thumb ~ * { display: none; }

  /* lakowa pieczęć */
  .seal {
    position: relative;
    width: calc(var(--cw) * .38); aspect-ratio: 1;
    display: grid; place-items: center;
    border-radius: 49% 51% 47% 53% / 52% 48% 52% 48%;
    background: radial-gradient(circle at 34% 30%, #A8362C 0%, #8E2B22 45%, #6E1F18 100%);
    box-shadow:
      0 8px 18px rgba(0, 0, 0, .6),
      0 2px 4px rgba(0, 0, 0, .5),
      inset 0 2px 4px rgba(255, 190, 170, .16),
      inset 0 -6px 12px rgba(0, 0, 0, .35);
    transform: rotate(-8deg);
  }
  .seal::before {
    content: ""; position: absolute; inset: 15%; border-radius: 50%;
    box-shadow: inset 0 0 0 2px rgba(60, 12, 8, .35), 0 0 0 1px rgba(255, 170, 150, .08);
  }
  .seal-p {
    font: italic 600 calc(var(--cw) * .2)/1 var(--serif);
    color: #6A1C15;
    padding-bottom: .06em;
    text-shadow: -1px -1px 0 rgba(30, 6, 4, .55), 1px 1px 0 rgba(255, 160, 140, .25);
  }

  /* ---------- sterowanie ---------- */
  .controls { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 0 16px; }
  .arrow {
    width: 52px; height: 52px; flex: none;
    display: grid; place-items: center;
    border-radius: 50%;
    background: rgba(12, 11, 9, .5);
    border: 1px solid rgba(201, 168, 92, .38);
    color: var(--gold);
    cursor: pointer;
    transition: border-color .2s, background .2s, color .2s;
  }
  .arrow:hover { border-color: var(--gold-hi); color: var(--gold-hi); background: rgba(201, 168, 92, .08); }
  .arrow svg { width: 18px; height: 18px; }

  .cta { width: 176px; display: flex; justify-content: center; }
  .play, .soon-badge {
    width: 100%; height: 52px;
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    border-radius: 999px;
    font: 600 13px/1 var(--mono); letter-spacing: .3em; text-transform: uppercase;
    text-decoration: none;
    padding-left: .3em;
  }
  .play {
    background: var(--gold); color: var(--bg);
    box-shadow: 0 10px 30px -10px rgba(201, 168, 92, .5);
    transition: background .2s, box-shadow .2s;
  }
  .play:hover { background: var(--gold-hi); box-shadow: 0 10px 36px -8px rgba(227, 199, 127, .55); }
  .play .arr { letter-spacing: 0; transition: transform .25s var(--ease); }
  .play:hover .arr { transform: translateX(4px); }
  .soon-badge { border: 1.5px dashed rgba(201, 168, 92, .42); color: var(--muted); }

  .dots { display: flex; justify-content: center; gap: 2px; margin-top: 22px; }
  .dot {
    width: 24px; height: 24px; padding: 0; border: 0; background: none; cursor: pointer;
    display: grid; place-items: center;
  }
  .dot::before {
    content: ""; display: block; width: 7px; height: 7px; border-radius: 4px;
    background: rgba(239, 232, 216, .22);
    transition: width var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .dot:hover::before { background: rgba(239, 232, 216, .45); }
  .dot[aria-current="true"] { width: 40px; }
  .dot[aria-current="true"]::before { width: 26px; background: var(--gold); }

  /* ---------- skaner kodów QR (żeby zostać w aplikacji PL3Y zamiast otwierać przeglądarkę) ---------- */
  .scanrow { display: flex; justify-content: center; margin-top: 14px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  .scan {
    height: 42px; padding: 0 20px; border-radius: 999px; cursor: pointer;
    background: rgba(12, 11, 9, .5); border: 1px solid rgba(201, 168, 92, .38); color: var(--gold);
    font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
  }
  .scan:hover { border-color: var(--gold-hi); color: var(--gold-hi); }
  .scanov {
    position: fixed; inset: 0; z-index: 50; background: rgba(8, 7, 6, .96);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px;
  }
  .scanov[hidden] { display: none; }
  .scanbox { position: relative; width: min(86vw, 420px); aspect-ratio: 1; border-radius: 18px; overflow: hidden; background: #000; }
  .scanbox video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scanframe { position: absolute; inset: 14%; border: 2px solid var(--gold); border-radius: 14px; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .35); }
  .scanmsg { margin: 0; max-width: 420px; text-align: center; color: var(--text); font-size: 15px; line-height: 1.45; min-height: 2.9em; }
  .scanclose {
    height: 46px; padding: 0 28px; border-radius: 999px; cursor: pointer;
    background: var(--gold); color: var(--bg); border: 0; font: 600 13px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase;
  }

  @media (max-width: 520px) {
    .stage { padding: 30px 0; }
    .controls { gap: 14px; }
    .arrow { width: 46px; height: 46px; }
    .cta { width: 152px; }
    .play, .soon-badge { height: 48px; font-size: 12px; }
  }
  @media (max-height: 560px) {
    .brand { padding-top: 14px; }
    .stage { padding: 22px 0; }
    .dots { margin-top: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    :root { --dur: .15s; }
    .card {
      transform:
        translate(-50%, -50%)
        translateX(calc(var(--x) * var(--cw)))
        scale(var(--s));
    }
    main { transition: none; }
    .play .arr { transition: none; }
  }
</style>
</head>
<body>
<h1 class="brand" aria-label="PL3Y">
  <img class="brand-mark" src="/mark.svg" alt="" aria-hidden="true">
  <span class="brand-name" aria-hidden="true">PL3Y</span>
</h1>

<main>
  <section class="stage" id="stage" aria-roledescription="karuzela" aria-label="Gry">
    <div class="track" id="track"></div>
  </section>

  <div class="controls">
    <button class="arrow" id="prev" type="button" aria-label="Poprzednia gra">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="cta" id="cta"></div>
    <button class="arrow" id="next" type="button" aria-label="Następna gra">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <div class="dots" id="dots" role="group" aria-label="Wybór gry"></div>
  <p class="sr" id="live" aria-live="polite"></p>
  <div class="scanrow"><button class="scan" id="scan" type="button" hidden>📷 Skanuj kod QR</button></div>
</main>

<div class="scanov" id="scanov" hidden role="dialog" aria-modal="true" aria-label="Skaner kodów QR">
  <div class="scanbox">
    <video id="scanvid" playsinline muted></video>
    <div class="scanframe" aria-hidden="true"></div>
  </div>
  <p class="scanmsg" id="scanmsg">Skieruj aparat na kod QR z ekranu gry.</p>
  <button class="scanclose" id="scanclose" type="button">Anuluj</button>
</div>

<script>
// Lista gier – nowa gra = jedna linijka.
// href: adres gry albo null (gra niedostępna); preview: 'board' | 'dossier' | 'seal'
// img: plik miniatury w img/ – podmiana pliku na GitHubie zmienia miniaturę; brak pliku = miniatura z preview
const GAMES = [
  { title: 'Tajniacy', label: 'Ściśle tajne',   href: '/tajniacy/', preview: 'board',   img: '/img/tajniacy.webp' },
  { title: 'Mafia',    label: 'Tajne role',     href: '/mafia/',    preview: 'dossier', img: '/img/mafia.webp'    },
  { title: 'Milion',   label: '12 pytań',       href: '/milion/',   preview: 'ladder',  img: '/img/milion.webp'   },
  { title: 'Wkrótce',  label: 'Zapieczętowane', href: null,         preview: 'seal',    img: '/img/wkrotce.webp'  },
  { title: 'Wkrótce',  label: 'Zapieczętowane', href: null,         preview: 'seal',    img: '/img/wkrotce.webp'  },
];

// Miniatura planszy: 9 czerwonych, 8 niebieskich, 7 neutralnych, 1 zabójca.
const BOARD = 'rbnrrbnabrnrbrnbrnbnrnbrb';

const PREVIEWS = {
  board: () => '<span class="board">' + [...BOARD].map(k => `<i class="sq ${k}"></i>`).join('') + '</span>',
  seal:  () => '<span class="seal"><span class="seal-p">P</span></span>',
  // drabinka 12 kwot, podświetlony 7. szczebel (próg 40 000 zł)
  ladder: () => '<span class="ladder">' + Array.from({ length: 12 }, (_, i) => `<i class="${i === 6 ? 'on' : ''}${i === 11 ? ' top' : ''}"></i>`).join('') + '</span>',
  // wachlarz trzech tajnych kart roli, środkowa z pieczęcią mafii
  dossier: () => '<span class="dossier"><i class="dc l"></i><i class="dc r"></i><i class="dc m"><span class="seal mini"><span class="seal-p">M</span></span></i></span>',
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = i => 'NO. ' + String(i + 1).padStart(2, '0');

const $ = id => document.getElementById(id);
const stage = $('stage'), track = $('track'), cta = $('cta'), dots = $('dots'), live = $('live');
const n = GAMES.length;
let active = 0;

// Położenie kart bocznych (wielokrotność szerokości karty), skala i przezroczystość wg odległości od środka.
const SHIFT = [0, .78, 1.32, 1.7];
const SCALE = [1, .8, .68, .6];
const ALPHA = [1, .55, .25, 0];

track.innerHTML = GAMES.map((g, i) => `
  <button class="card${g.href ? '' : ' soon'}" type="button" data-i="${i}"
          aria-label="${esc(g.title)}, ${num(i)}${g.href ? '' : ', niedostępna'}">
    <span class="card-top"><span class="card-no">${num(i)}</span><span class="card-tag">${esc(g.label)}</span></span>
    <span class="card-art" aria-hidden="true">${g.img ? `<img class="thumb" src="${esc(g.img)}" alt="" onerror="this.remove()">` : ''}${(PREVIEWS[g.preview] || PREVIEWS.seal)()}</span>
    <span class="card-title">${esc(g.title)}</span>
  </button>`).join('');

dots.innerHTML = GAMES.map((g, i) =>
  `<button class="dot" type="button" data-i="${i}" aria-label="${esc(g.title)}, ${num(i)}"></button>`).join('');

const cards = [...track.children];
const dotEls = [...dots.children];

// Najkrótsza odległość ze znakiem na zapętlonej liście.
function offset(i) {
  let d = ((i - active) % n + n) % n;
  if (d > n / 2) d -= n;
  return d;
}

function layout(announce) {
  cards.forEach((el, i) => {
    const d = offset(i), a = Math.min(Math.abs(d), 3), s = Math.sign(d);
    el.dataset.pos = a;
    el.classList.toggle('is-active', d === 0);
    el.style.setProperty('--x', s * SHIFT[a]);
    el.style.setProperty('--a', a);
    el.style.setProperty('--ry', (-s * 32) + 'deg');
    el.style.setProperty('--s', SCALE[a]);
    el.style.setProperty('--o', ALPHA[a]);
    el.tabIndex = a > 2 ? -1 : 0;
    el.toggleAttribute('aria-hidden', a > 2);
    el.setAttribute('aria-current', d === 0 ? 'true' : 'false');
  });
  dotEls.forEach((el, i) => el.setAttribute('aria-current', i === active ? 'true' : 'false'));

  const g = GAMES[active];
  cta.innerHTML = g.href
    ? `<a class="play" href="${esc(g.href)}">Graj <span class="arr" aria-hidden="true">→</span></a>`
    : '<span class="soon-badge">Wkrótce</span>';

  if (announce) live.textContent = `${g.title}, ${active + 1} z ${n}${g.href ? '' : ', niedostępna'}`;
}

function go(i) {
  active = ((i % n) + n) % n;
  layout(true);
}

function launch() {
  const g = GAMES[active];
  if (!g.href) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { location.href = g.href; return; }
  document.body.classList.add('leaving');
  setTimeout(() => { location.href = g.href; }, 220);
}
addEventListener('pageshow', () => document.body.classList.remove('leaving'));

// Kliknięcie myszą/palcem zdejmuje fokus z przycisku, żeby Enter dalej uruchamiał grę.
const dropFocus = e => { if (e.detail > 0) e.currentTarget.blur(); };

let swiped = false;
track.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card || swiped) return;
  const i = +card.dataset.i;
  if (i === active) launch(); else go(i);
});
$('prev').addEventListener('click', e => { go(active - 1); dropFocus(e); });
$('next').addEventListener('click', e => { go(active + 1); dropFocus(e); });
dots.addEventListener('click', e => {
  const d = e.target.closest('.dot');
  if (!d) return;
  go(+d.dataset.i);
  if (e.detail > 0) d.blur();
});
cta.addEventListener('click', e => {
  if (e.target.closest('.play') && !e.ctrlKey && !e.metaKey && !e.shiftKey && e.button === 0) {
    e.preventDefault();
    launch();
  }
});

document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const t = e.target;
  if (t.closest && t.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft')  { e.preventDefault(); go(active - 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go(active + 1); }
  // Enter na przycisku/linku robi to, co ten element; poza nimi uruchamia grę ze środka.
  else if (e.key === 'Enter' && !t.closest('button, a')) { e.preventDefault(); launch(); }
});

// Swipe palcem
let sx = null, sy = 0;
stage.addEventListener('touchstart', e => {
  const t = e.touches[0];
  sx = t.clientX; sy = t.clientY;
}, { passive: true });
stage.addEventListener('touchend', e => {
  if (sx === null) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  sx = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2) {
    swiped = true;
    go(active + (dx < 0 ? 1 : -1));
    setTimeout(() => { swiped = false; }, 400);
  }
}, { passive: true });

layout(false);
</script>
<script>
/* Skaner kodów QR. Systemowy aparat otwiera link w przeglądarce, a ten skaner otwiera go wewnątrz aplikacji PL3Y
   (z ekranu głównego). Dekodowanie: BarcodeDetector (Android/Chrome), a w Safari jsQR z /vendor/jsQR.js (ładowany dopiero tu).
   Przyjmuje tylko adresy PL3Y i otwiera je pod bieżącym adresem strony, żeby zostać w aplikacji. */
(function () {
  const HOSTS = ['pl3y.pl', 'www.pl3y.pl', 'egozaur.github.io'];
  // Tekst z kodu QR → adres do otwarcia albo null (obcy kod).
  function target(text) {
    try {
      const u = new URL(String(text).trim());
      if (u.protocol !== 'https:' && u.protocol !== 'http:') return null;
      if (!HOSTS.includes(u.hostname) && u.host !== location.host) return null;
      return location.origin + u.pathname + u.search + u.hash;
    } catch (e) { return null; }
  }
  window.PL3Y_SCAN = { target };

  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) return;
  // przycisk tylko na telefonach i tabletach (na komputerze nie ma czego skanować); ?scan wymusza go do testów
  if (!matchMedia('(pointer: coarse)').matches && !/[?&]scan\b/.test(location.search)) return;

  const btn = document.getElementById('scan'), ov = document.getElementById('scanov');
  const vid = document.getElementById('scanvid'), msg = document.getElementById('scanmsg');
  const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  let stream = null, timer = null, detector = null, busy = false;
  btn.hidden = false;

  async function decoder() {
    if (detector || window.jsQR) return;
    if ('BarcodeDetector' in window) {
      try {
        if ((await BarcodeDetector.getSupportedFormats()).includes('qr_code')) { detector = new BarcodeDetector({ formats: ['qr_code'] }); return; }
      } catch (e) {}
    }
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = '/vendor/jsQR.js'; s.onload = res; s.onerror = () => rej(new Error('jsqr'));
      document.head.appendChild(s);
    });
  }

  async function frame() {
    if (!stream || busy || vid.readyState < 2) return;
    busy = true;
    try {
      let text = null;
      if (detector) {
        const r = await detector.detect(vid);
        if (r.length) text = r[0].rawValue;
      } else {
        const w = vid.videoWidth, h = vid.videoHeight, k = Math.min(1, 640 / Math.max(w, h));
        canvas.width = Math.round(w * k); canvas.height = Math.round(h * k);
        ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
        const d = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const r = window.jsQR(d.data, d.width, d.height, { inversionAttempts: 'dontInvert' });
        if (r) text = r.data;
      }
      if (text) found(text);
    } catch (e) {} finally { busy = false; }
  }

  function found(text) {
    const url = target(text);
    if (!url) { msg.textContent = 'To nie jest kod PL3Y. Zeskanuj kod z ekranu gry.'; return; }
    msg.textContent = 'Otwieram…';
    stop(false);
    location.href = url;
  }

  async function open() {
    ov.hidden = false;
    msg.textContent = 'Uruchamiam aparat…';
    try {
      await decoder();
      stream = await md.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      vid.srcObject = stream;
      await vid.play();
      msg.textContent = 'Skieruj aparat na kod QR z ekranu gry.';
      timer = setInterval(frame, 150);
    } catch (e) {
      stop(false);
      msg.textContent = e && e.name === 'NotAllowedError'
        ? 'Brak dostępu do aparatu. Zezwól na niego w Ustawieniach telefonu (iPhone: Ustawienia → Safari → Aparat) i spróbuj ponownie.'
        : 'Nie udało się uruchomić aparatu.';
    }
  }

  function stop(hide = true) {
    clearInterval(timer); timer = null;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    vid.srcObject = null;
    if (hide) ov.hidden = true;
  }

  btn.addEventListener('click', open);
  document.getElementById('scanclose').addEventListener('click', () => stop());
  document.addEventListener('visibilitychange', () => { if (document.hidden && !ov.hidden) stop(); });
  // klawisze karuzeli nie działają pod otwartym skanerem; Escape zamyka
  document.addEventListener('keydown', e => {
    if (ov.hidden) return;
    e.stopPropagation();
    if (e.key === 'Escape') stop();
  }, true);
})();
</script>
</body>
</html>
