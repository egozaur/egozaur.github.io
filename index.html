<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0B09">
<meta name="robots" content="noindex, nofollow">
<title>PL3Y</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="apple-mobile-web-app-title" content="PL3Y">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script src="/auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0C0B09;
    --glow: #1C1813;
    --gold: #C9A85C;
    --gold-hi: #E3C77F;
    --text: #EFE8D8;
    --muted: #A39C8C;
    --red: #B9463B;
    --blue: #3E6AA8;
    --neutral: #2A2620;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.22, .8, .24, 1);
    --dur: .6s;
    /* szerokość aktywnej karty: ~360 px na dużym ekranie, ~250 px na telefonie */
    --cw: clamp(190px, min(66vw, calc((100vh - 290px) * .72)), 360px);
    --ch: calc(var(--cw) * 1.39);
  }
  @supports (height: 100svh) {
    :root { --cw: clamp(190px, min(66vw, calc((100svh - 290px) * .72)), 360px); }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: var(--bg) radial-gradient(ellipse 70% 60% at 50% 48%, var(--glow) 0%, var(--bg) 70%) no-repeat fixed;
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 4px; }
  .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }

  /* ---------- znak ---------- */
  .brand {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin: 0; padding: max(28px, env(safe-area-inset-top)) 16px 0;
    font-weight: normal;
  }
  .brand-mark {
    display: block; width: 40px; height: 40px;
    filter: drop-shadow(0 0 10px rgba(233, 196, 106, .35));
  }
  .brand-name { font: 500 13px/1 var(--mono); letter-spacing: .42em; color: var(--text); margin-right: -.42em; }

  main {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px 0 max(28px, env(safe-area-inset-bottom));
    transition: opacity .25s ease;
  }
  body.leaving main { opacity: 0; }

  /* ---------- karuzela ---------- */
  .stage {
    width: 100%;
    overflow: hidden;
    padding: 44px 0;
    touch-action: pan-y;
  }
  .track {
    position: relative;
    height: var(--ch);
    perspective: 1600px;
    transform-style: preserve-3d;
  }
  .card {
    --x: 0; --a: 0; --ry: 0deg; --s: 1; --o: 1;
    position: absolute; left: 50%; top: 50%;
    width: var(--cw); height: var(--ch);
    margin: 0; padding: calc(var(--cw) * .072);
    display: flex; flex-direction: column; align-items: stretch;
    text-align: left;
    background: linear-gradient(165deg, #1B1814 0%, #13110E 55%, #0F0E0B 100%);
    border: 1px solid rgba(201, 168, 92, .22);
    border-radius: 16px;
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .7);
    cursor: pointer;
    opacity: var(--o);
    z-index: calc(10 - var(--a));
    transform:
      translate(-50%, -50%)
      translateX(calc(var(--x) * var(--cw)))
      translateZ(calc(var(--a) * -70px))
      rotateY(var(--ry))
      scale(var(--s));
    transition:
      transform var(--dur) var(--ease),
      opacity var(--dur) var(--ease),
      filter var(--dur) var(--ease),
      border-color var(--dur) var(--ease),
      box-shadow var(--dur) var(--ease),
      visibility 0s linear 0s;
    will-change: transform, opacity;
    -webkit-tap-highlight-color: transparent;
  }
  .card[data-pos="1"] { filter: brightness(.62) saturate(.5); }
  .card[data-pos="2"] { filter: brightness(.75) saturate(.45); }
  .card[data-pos="3"] {
    visibility: hidden; pointer-events: none;
    transition-property: transform, opacity, filter, border-color, box-shadow, visibility;
    transition-delay: 0s, 0s, 0s, 0s, 0s, var(--dur);
  }
  .card.is-active {
    border-color: var(--gold);
    box-shadow:
      0 0 0 1px rgba(201, 168, 92, .25),
      0 0 60px -6px rgba(201, 168, 92, .32),
      0 40px 80px -24px rgba(0, 0, 0, .85);
  }
  .card:not(.is-active):hover { border-color: rgba(201, 168, 92, .5); }
  .card:focus-visible { outline-offset: 6px; border-radius: 16px; }

  .card.soon {
    background: linear-gradient(165deg, #16130F 0%, #100E0B 100%);
    border: 1.5px dashed rgba(201, 168, 92, .3);
  }
  .card.soon.is-active {
    border-color: rgba(201, 168, 92, .85);
    box-shadow: 0 0 50px -10px rgba(201, 168, 92, .22), 0 40px 80px -24px rgba(0, 0, 0, .85);
  }

  .card-top {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    font: 500 max(9.5px, calc(var(--cw) * .03))/1 var(--mono);
    letter-spacing: .22em; text-transform: uppercase;
  }
  .card-no { color: var(--muted); }
  .card-tag { color: var(--gold); text-align: right; }
  .card-art { flex: 1; display: grid; place-items: center; min-height: 0; }
  .card-title {
    display: block;
    font: 600 calc(var(--cw) * .135)/1 var(--serif);
    letter-spacing: .005em;
    color: var(--text);
    padding-top: calc(var(--cw) * .045);
    border-top: 1px solid rgba(201, 168, 92, .16);
  }
  .card.soon .card-title { color: var(--muted); }

  /* miniatura planszy Tajniaków */
  .board {
    width: 66%;
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: calc(var(--cw) * .016);
    padding: calc(var(--cw) * .03);
    background: rgba(0, 0, 0, .3);
    border: 1px solid rgba(201, 168, 92, .14);
    border-radius: 10px;
  }
  .sq {
    display: block; aspect-ratio: 1; border-radius: 3px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), inset 0 -2px 3px rgba(0, 0, 0, .25);
  }
  .sq.r { background: var(--red); }
  .sq.b { background: var(--blue); }
  .sq.n { background: var(--neutral); }
  .sq.a { background: #070605; box-shadow: inset 0 0 0 1.5px var(--gold), 0 0 8px rgba(201, 168, 92, .35); }

  /* miniatura Mafii: wachlarz kart roli */
  .dossier { position: relative; width: 62%; aspect-ratio: 1; display: block; }
  .dc {
    position: absolute; left: 50%; top: 50%; width: 52%; aspect-ratio: .72; border-radius: 8px;
    background: linear-gradient(165deg, #241F18, #14110D);
    border: 1px solid rgba(201, 168, 92, .45);
    box-shadow: 0 12px 24px -10px rgba(0, 0, 0, .8);
    transform-origin: 50% 120%;
  }
  .dc.l { transform: translate(-50%, -50%) rotate(-16deg); }
  .dc.r { transform: translate(-50%, -50%) rotate(16deg); }
  .dc.m { transform: translate(-50%, -50%); display: grid; place-items: center; border-color: var(--red); }
  .seal.mini { width: 62%; transform: rotate(-8deg); }
  .seal.mini .seal-p { font-size: calc(var(--cw) * .1); }

  /* miniatura Rozejrzyj się: złota litera w podwójnym okręgu, jak pieczęć z gry */
  .lring {
    position: relative; width: 58%; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%;
    border: 1px solid rgba(201, 168, 92, .45);
    background: radial-gradient(circle at 50% 40%, rgba(201, 168, 92, .12), transparent 70%);
    box-shadow: 0 0 0 calc(var(--cw) * .018) #0F0E0B, 0 0 0 calc(var(--cw) * .021) rgba(201, 168, 92, .22), 0 0 30px rgba(201, 168, 92, .12);
  }
  .lring::before { content: ""; position: absolute; inset: 8%; border-radius: 50%; border: 1px solid rgba(201, 168, 92, .22); }
  .lring b {
    font: 600 calc(var(--cw) * .3)/1 var(--serif); padding-bottom: .08em;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, #8A6A24); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px rgba(233, 196, 106, .3));
  }

  /* miniatura Miliona: drabinka kwot z podświetlonym szczeblem */
  .ladder { width: 64%; display: flex; flex-direction: column-reverse; gap: calc(var(--cw) * .014); }
  .ladder i {
    display: block; height: calc(var(--cw) * .034); border-radius: 99px;
    background: rgba(201, 168, 92, .16); border: 1px solid rgba(201, 168, 92, .22);
  }
  .ladder i:nth-child(2n) { width: 86%; align-self: flex-end; }
  .ladder i.on { background: linear-gradient(90deg, #8a6a24, var(--gold), #8a6a24); box-shadow: 0 0 10px rgba(201, 168, 92, .45); }
  .ladder i.top { border-color: var(--gold); }

  /* miniatura Kurczaczego Imperium: piramida kart, dolny rząd podświetlony */
  .pyr { width: 70%; display: flex; flex-direction: column; align-items: center; }
  .pyr-row { display: flex; gap: calc(var(--cw) * .014); margin-top: calc(var(--cw) * -.06); }
  .pyr-row:first-child { margin-top: 0; }
  .pyr i { display: block; width: calc(var(--cw) * .1); aspect-ratio: 44 / 68; border-radius: calc(var(--cw) * .012); background: #15130F; border: 1px solid rgba(201, 168, 92, .35); }
  .pyr i.on { background: linear-gradient(180deg, rgba(233, 196, 106, .35), rgba(201, 168, 92, .12)); border-color: var(--gold); box-shadow: 0 0 10px rgba(201, 168, 92, .3); }

  /* miniatura z pliku img/*.webp; gdy pliku brak, img znika i zostaje miniatura z CSS */
  .thumb { display: block; width: 66%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; }
  .thumb ~ * { display: none; }

  /* lakowa pieczęć */
  .seal {
    position: relative;
    width: calc(var(--cw) * .38); aspect-ratio: 1;
    display: grid; place-items: center;
    border-radius: 49% 51% 47% 53% / 52% 48% 52% 48%;
    background: radial-gradient(circle at 34% 30%, #A8362C 0%, #8E2B22 45%, #6E1F18 100%);
    box-shadow:
      0 8px 18px rgba(0, 0, 0, .6),
      0 2px 4px rgba(0, 0, 0, .5),
      inset 0 2px 4px rgba(255, 190, 170, .16),
      inset 0 -6px 12px rgba(0, 0, 0, .35);
    transform: rotate(-8deg);
  }
  .seal::before {
    content: ""; position: absolute; inset: 15%; border-radius: 50%;
    box-shadow: inset 0 0 0 2px rgba(60, 12, 8, .35), 0 0 0 1px rgba(255, 170, 150, .08);
  }
  .seal-p {
    font: italic 600 calc(var(--cw) * .2)/1 var(--serif);
    color: #6A1C15;
    padding-bottom: .06em;
    text-shadow: -1px -1px 0 rgba(30, 6, 4, .55), 1px 1px 0 rgba(255, 160, 140, .25);
  }

  /* ---------- sterowanie ---------- */
  .controls { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 0 16px; }
  .arrow {
    width: 52px; height: 52px; flex: none;
    display: grid; place-items: center;
    border-radius: 50%;
    background: rgba(12, 11, 9, .5);
    border: 1px solid rgba(201, 168, 92, .38);
    color: var(--gold);
    cursor: pointer;
    transition: border-color .2s, background .2s, color .2s;
  }
  .arrow:hover { border-color: var(--gold-hi); color: var(--gold-hi); background: rgba(201, 168, 92, .08); }
  .arrow svg { width: 18px; height: 18px; }

  .cta { width: 176px; display: flex; justify-content: center; }
  .play, .soon-badge {
    width: 100%; height: 52px;
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    border-radius: 999px;
    font: 600 13px/1 var(--mono); letter-spacing: .3em; text-transform: uppercase;
    text-decoration: none;
    padding-left: .3em;
  }
  .play {
    background: var(--gold); color: var(--bg);
    box-shadow: 0 10px 30px -10px rgba(201, 168, 92, .5);
    transition: background .2s, box-shadow .2s;
  }
  .play:hover { background: var(--gold-hi); box-shadow: 0 10px 36px -8px rgba(227, 199, 127, .55); }
  .play .arr { letter-spacing: 0; transition: transform .25s var(--ease); }
  .play:hover .arr { transform: translateX(4px); }
  .soon-badge { border: 1.5px dashed rgba(201, 168, 92, .42); color: var(--muted); }

  .dots { display: flex; justify-content: center; gap: 2px; margin-top: 22px; }
  .dot {
    width: 24px; height: 24px; padding: 0; border: 0; background: none; cursor: pointer;
    display: grid; place-items: center;
  }
  .dot::before {
    content: ""; display: block; width: 7px; height: 7px; border-radius: 4px;
    background: rgba(239, 232, 216, .22);
    transition: width var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .dot:hover::before { background: rgba(239, 232, 216, .45); }
  .dot[aria-current="true"] { width: 40px; }
  .dot[aria-current="true"]::before { width: 26px; background: var(--gold); }

  /* ---------- skaner kodów QR (żeby zostać w aplikacji PL3Y zamiast otwierać przeglądarkę) ---------- */
  .scanrow { display: flex; justify-content: center; margin-top: 14px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  .scan {
    height: 42px; padding: 0 20px; border-radius: 999px; cursor: pointer;
    background: rgba(12, 11, 9, .5); border: 1px solid rgba(201, 168, 92, .38); color: var(--gold);
    font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
  }
  .scan:hover { border-color: var(--gold-hi); color: var(--gold-hi); }
  .scanov {
    position: fixed; inset: 0; z-index: 50; background: rgba(8, 7, 6, .96);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px;
  }
  .scanov[hidden] { display: none; }
  .scanbox { position: relative; width: min(86vw, 420px); aspect-ratio: 1; border-radius: 18px; overflow: hidden; background: #000; }
  .scanbox video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scanframe { position: absolute; inset: 14%; border: 2px solid var(--gold); border-radius: 14px; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .35); }
  .scanmsg { margin: 0; max-width: 420px; text-align: center; color: var(--text); font-size: 15px; line-height: 1.45; min-height: 4.4em; }
  .scanclose {
    height: 46px; padding: 0 28px; border-radius: 999px; cursor: pointer;
    background: var(--gold); color: var(--bg); border: 0; font: 600 13px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase;
  }

  /* ---------- akcent gry w tle (płynna zmiana koloru) ---------- */
  @property --accent { syntax: '<color>'; inherits: true; initial-value: #C9A85C; }
  body { --accent: #C9A85C; transition: --accent .8s ease; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(ellipse 55% 45% at 50% 46%, color-mix(in srgb, var(--accent) 17%, transparent) 0%, transparent 70%),
      radial-gradient(ellipse 80% 30% at 50% 108%, color-mix(in srgb, var(--accent) 12%, transparent) 0%, transparent 70%);
    animation: breathe 9s ease-in-out infinite alternate;
  }
  @keyframes breathe { from { opacity: .65; } to { opacity: 1; } }

  /* ---------- narzędzia w rogu: widok i dźwięk ---------- */
  .tools {
    position: absolute; top: max(18px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right));
    display: flex; gap: 8px; z-index: 5;
  }
  .tool {
    width: 40px; height: 40px; display: grid; place-items: center; padding: 0; cursor: pointer;
    border-radius: 50%; background: rgba(12, 11, 9, .5); border: 1px solid rgba(201, 168, 92, .32); color: var(--gold);
    transition: border-color .2s, color .2s, background .2s;
  }
  .tool:hover { border-color: var(--gold-hi); color: var(--gold-hi); background: rgba(201, 168, 92, .08); }
  .tool svg { width: 18px; height: 18px; }
  .tool .off, .tool[aria-pressed="true"] .on { display: none; }
  .tool[aria-pressed="true"] .off { display: block; }
  #viewbtn .ic-car { display: none; }
  body[data-view="grid"] #viewbtn .ic-grid { display: none; }
  body[data-view="grid"] #viewbtn .ic-car { display: block; }

  /* ---------- opis wybranej gry ---------- */
  .desc {
    margin: 0 0 18px; padding: 0 24px; max-width: 460px; min-height: 2.9em;
    text-align: center; font: 400 15px/1.45 var(--sans); color: var(--muted);
    }
  .desc { max-width: 520px; display: grid; min-height: 0; contain: layout paint; }
  .b-item {
    grid-area: 1 / 1; align-self: start; opacity: 0; visibility: hidden;
    transition: opacity .25s ease, visibility 0s linear .25s;
  }
  .b-item.on { opacity: 1; visibility: visible; transition: opacity .3s ease .12s, visibility 0s; }
  .b-item .gnote { margin: 12px auto 0; width: fit-content; max-width: 100%; }
  .b-lead { display: block; color: var(--text, #EDE6D6); }
  .b-facts {
    display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 14px 0 0; padding: 12px 0 0;
    border-top: 1px solid rgba(201, 168, 92, .22); text-align: left; font-size: 13.5px; line-height: 1.4;
  }
  .b-facts dt { color: var(--gold); font: 600 10.5px/1.9 var(--sans); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
  .b-facts dd { margin: 0; color: var(--muted); }
  .note, .gnote {
    display: flex; gap: 8px; align-items: flex-start; text-align: left;
    font: 500 12.5px/1.4 var(--sans); color: var(--gold-hi);
    background: rgba(201, 168, 92, .08); border: 1px solid rgba(201, 168, 92, .3); border-radius: 10px;
    padding: 8px 12px;
  }
  .note { margin: -6px 24px 16px; max-width: 420px; }
  .note[hidden] { display: none; }
  .note::before, .gnote::before { content: "🔒"; flex: none; }

  /* ---------- widok siatki ---------- */
  .grid {
    width: 100%; max-width: 1040px; margin: 0 auto; padding: 22px 16px 8px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px;
  }
  .grid[hidden] { display: none; }
  body[data-view="grid"] .stage,
  body[data-view="grid"] .controls,
  body[data-view="grid"] .dots,
  body[data-view="grid"] .desc,
  body[data-view="grid"] .note { display: none; }
  .gcard {
    --cw: 170px;
    display: flex; flex-direction: column; gap: 10px; text-align: left; cursor: pointer;
    padding: 14px; border-radius: 16px;
    background: linear-gradient(165deg, #1B1814 0%, #13110E 55%, #0F0E0B 100%);
    border: 1px solid rgba(201, 168, 92, .22);
    transition: transform .25s var(--ease), border-color .2s, box-shadow .25s, opacity .25s;
    -webkit-tap-highlight-color: transparent;
  }
  .gcard:hover, .gcard:focus-visible { border-color: var(--gold); transform: translateY(-3px); box-shadow: 0 18px 40px -18px color-mix(in srgb, var(--ga) 55%, transparent); }
  .gcard.soon { border: 1.5px dashed rgba(201, 168, 92, .3); background: #100E0B; }
  .gcard.soon .card-title { color: var(--muted); }
  .gcard .card-art { flex: none; height: 170px; }
  .gcard .card-title { font-size: 26px; }
  .gcard .gdesc { font: 400 13.5px/1.45 var(--sans); color: var(--muted); }
  .gcard.go { transform: scale(1.05); opacity: 0; }

  /* ---------- przejście karuzela ⇄ siatka: taśma filmowa ---------- */
  .reel {
    position: fixed; z-index: 1; pointer-events: none; border-radius: 6px;
    background: #0A0907; border: 1px solid rgba(201, 168, 92, .35);
    box-shadow: 0 20px 50px -20px rgba(0, 0, 0, .8);
  }
  .reel[hidden] { display: none; }
  .reel::before, .reel::after {
    content: ""; position: absolute; left: 8px; right: 8px; height: 6px; border-radius: 2px;
    background: repeating-linear-gradient(90deg, rgba(201, 168, 92, .5) 0 8px, transparent 8px 16px);
  }
  .reel::before { top: 6px; }
  .reel::after { bottom: 6px; }
  body.animating { overflow-x: hidden; }
  body.animating .gcard { position: relative; z-index: 2; pointer-events: none; transition: none; transform-origin: 0 0; }
  body.leaving .card.is-active { --s: 1.14 !important; }

  /* ---------- dołączanie kodem pokoju ---------- */
  .joinbox { width: 100%; max-width: 420px; padding: 0 16px; margin-top: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .joinform { display: flex; gap: 8px; width: 100%; }
  .joinin {
    flex: 1; min-width: 0; height: 42px; padding: 0 16px; border-radius: 999px; text-align: center;
    background: rgba(12, 11, 9, .5); border: 1px solid rgba(201, 168, 92, .38); color: var(--text);

<script>
// Lista gier – nowa gra = jedna linijka.

const GAMES = [

  { title: 'Milionerzy', label: '12 pytań',       href: '/milion/',   preview: 'ladder',  img: '/img/milion.webp',

      players: '2', mode: 'Pojedynek 1 vs 1', mech: 'Dobieranie kart i budowanie talii', goal: 'Zbuduj najlepsze imperium i pokonaj przeciwnika.' } },
  { title: 'Wordle', label: 'Słowo dnia', href: '/wordle/', preview: 'letter',

    brief: { lead: 'Zgadnij ukryte słowo w 6 próbach. Kolory podpowiedzą, które litery są na właściwym miejscu.',

  { title: 'Wkrótce',  label: 'Zapieczętowane', href: null,         preview: 'seal',    img: '/img/wkrotce.webp',
    desc: 'Nowa rozgrywka jest w przygotowaniu. Szczegóły pozostają tajemnicą.', accent: '#B9463B',

// PL3Y GAME BRIEF – jeden standard opisu gry. Pola opcjonalne: pole bez wartości się nie pokazuje.
// lead: 1–2 zdania; players, time, mode, mech, play, req, goal: dane faktyczne (nie wymyślamy brakujących).
const BRIEF_FIELDS = [['players', 'Gracze'], ['time', 'Czas'], ['mode', 'Tryb'], ['play', 'Rozgrywka'], ['mech', 'Mechanika'], ['req', 'Wymagania'], ['goal', 'Cel']];
function briefHTML(g, full) {
  const b = g.brief || { lead: g.desc || '' };
  const rows = full ? BRIEF_FIELDS.filter(([k]) => b[k]).map(([k, l]) => `<dt>${l}</dt><dd>${esc(b[k])}</dd>`).join('') : '';
  return `<span class="b-lead">${esc(b.lead)}</span>${rows ? `<dl class="b-facts">${rows}</dl>` : ''}`;
}

// Dołączanie kodem pokoju: każda gra ma własną przestrzeń kodów i własny format linku, więc gracz wskazuje grę.
const JOIN = [
  { game: 'Mafia',      name: 'Mafia',        url: c => '/mafia/play.html?r=' + c },
  { game: 'Milionerzy', name: 'Milionerzy',   url: c => '/milion/play.html#' + c },
  { game: 'Tajniacy',   name: 'Tajniacy duet', url: c => '/tajniacy/duo.html#' + c },
  { game: 'Kurczacze Imperium', name: 'Kurczacze', url: c => '/kurczacze/#' + c },
];

// Miniatura planszy: 9 czerwonych, 8 niebieskich, 7 neutralnych, 1 zabójca.
const BOARD = 'rbnrrbnabrnrbrnbrnbnrnbrb';

const PREVIEWS = {
  board: () => '<span class="board">' + [...BOARD].map(k => `<i class="sq ${k}"></i>`).join('') + '</span>',
  seal:  () => '<span class="seal"><span class="seal-p">P</span></span>',
  // drabinka 12 kwot, podświetlony 7. szczebel (próg 40 000 zł)
  ladder: () => '<span class="ladder">' + Array.from({ length: 12 }, (_, i) => `<i class="${i === 6 ? 'on' : ''}${i === 11 ? ' top' : ''}"></i>`).join('') + '</span>',
  // wachlarz trzech tajnych kart roli, środkowa z pieczęcią mafii
  // złota litera w okręgu (Rozejrzyj się)
  letter: () => '<span class="lring"><b>R</b></span>',
  dossier: () => '<span class="dossier"><i class="dc l"></i><i class="dc r"></i><i class="dc m"><span class="seal mini"><span class="seal-p">M</span></span></i></span>',
  // piramida kart Ery Jajka (3-4-5), dolny rząd dostępny (Kurczacze Imperium)
  pyramid: () => '<span class="pyr">' + [3, 4, 5].map((n, r) => `<span class="pyr-row">${('<i' + (r === 2 ? ' class="on"' : '') + '></i>').repeat(n)}</span>`).join('') + '</span>',
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = i => 'NO. ' + String(i + 1).padStart(2, '0');

const $ = id => document.getElementById(id);
const stage = $('stage'), track = $('track'), cta = $('cta'), dots = $('dots'), live = $('live');
const n = GAMES.length;
let active = 0;
const descEl = $('desc');
// wszystkie briefy leżą w jednej komórce gridu: blok ma wysokość najwyższego, więc zmiana gry nie przesuwa układu
descEl.innerHTML = GAMES.map(g => `<div class="b-item">${briefHTML(g, true)}${g.note ? `<span class="gnote">${esc(g.note)}</span>` : ''}</div>`).join('');
const briefEls = [...descEl.children];

// Położenie kart bocznych (wielokrotność szerokości karty), skala i przezroczystość wg odległości od środka.
const SHIFT = [0, .78, 1.42, 1.8];
const SCALE = [1, .8, .68, .6];
const ALPHA = [1, .6, .5, 0];

track.innerHTML = GAMES.map((g, i) => `
  <button class="card${g.href ? '' : ' soon'}" type="button" data-i="${i}"
          aria-label="${esc(g.title)}, ${num(i)}${g.href ? '' : ', niedostępna'}">
    <span class="card-top"><span class="card-no">${num(i)}</span><span class="card-tag">${esc(g.label)}</span></span>
    <span class="card-art" aria-hidden="true">${g.img ? `<img class="thumb" src="${esc(g.img)}" alt="" onerror="this.remove()">` : ''}${(PREVIEWS[g.preview] || PREVIEWS.seal)()}</span>
    <span class="card-title">${esc(g.title)}</span>
  </button>`).join('');

dots.innerHTML = GAMES.map((g, i) =>
  `<button class="dot" type="button" data-i="${i}" aria-label="${esc(g.title)}, ${num(i)}"></button>`).join('');

const cards = [...track.children];
const dotEls = [...dots.children];

// ---------- siatka wszystkich gier ----------
const grid = $('grid');
grid.innerHTML = GAMES.map((g, i) => `
  <button class="gcard${g.href ? '' : ' soon'}" type="button" data-i="${i}" style="--ga:${esc(g.accent || '#C9A85C')}"
          aria-label="${esc(g.title)}${g.href ? '' : ', niedostępna'}. ${esc(g.desc || '')}${g.note ? ' ' + esc(g.note) : ''}">
    <span class="card-top"><span class="card-no">${num(i)}</span><span class="card-tag">${esc(g.label)}</span></span>
    <span class="card-art" aria-hidden="true">${g.img ? `<img class="thumb" src="${esc(g.img)}" alt="" onerror="this.remove()">` : ''}${(PREVIEWS[g.preview] || PREVIEWS.seal)()}</span>
    <span class="card-title">${esc(g.title)}</span>
    <span class="gdesc">${esc(g.desc || '')}</span>
    ${g.note ? `<span class="gnote">${esc(g.note)}</span>` : ''}
  </button>`).join('');
const gcards = [...grid.children];

// ---------- dźwięk i haptyka (Web Audio, bez plików) ----------
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
let muted = store.get('pl3y_mute') === '1';
let actx = null;
function beep(freq, dur, vol, type, delay) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || .05, t + .008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
const buzz = ms => { if (!muted && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } };
const sfx = {
  tick()  { beep(740, .07, .035, 'triangle'); buzz(8); },
  swap()  { beep(520, .06, .03, 'triangle'); buzz(6); },
  launch() { beep(523, .16, .05, 'sine'); beep(784, .24, .05, 'sine', .09); buzz(18); },
  error() { beep(180, .16, .05, 'square'); buzz([20, 40, 20]); },
};
const mutebtn = $('mutebtn');
function paintMute() {
  mutebtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
  mutebtn.setAttribute('aria-label', muted ? 'Włącz dźwięki' : 'Wycisz dźwięki');
}
mutebtn.addEventListener('click', () => { muted = !muted; store.set('pl3y_mute', muted ? '1' : '0'); paintMute(); if (!muted) sfx.tick(); });
paintMute();

// ---------- widok: karuzela / siatka ----------
let view = store.get('pl3y_view') === 'grid' ? 'grid' : 'carousel';
const viewbtn = $('viewbtn');
function setView(v, save) {
  view = v;
  document.body.dataset.view = v;
  grid.hidden = v !== 'grid';
  viewbtn.setAttribute('aria-label', v === 'grid' ? 'Wróć do karuzeli' : 'Pokaż wszystkie gry (siatka)');
  if (save) store.set('pl3y_view', v);
}
// Przejście: karuzela zwija się w taśmę filmową, taśma rozwija się w kafelki siatki (i odwrotnie).
// Tylko transform i opacity (Web Animations API), więc animacja idzie na GPU.
const reel = $('reel');
let viewBusy = false;
const T_APPEAR = 220, T_STAG = 55, T_FLY = 620, T_HOLD = 120, T_OUT = 170;
const FLY_EASE = 'cubic-bezier(.22,.8,.2,1)', FOLD_EASE = 'cubic-bezier(.6,0,.3,1)';
const fin = a => a.finished.catch(() => {});

// Ułożenie klatek w taśmie (współrzędne okna): lewy górny róg i skala każdego kafelka.
function stripFrames() {
  const vw = innerWidth, n = gcards.length, gap = vw < 520 ? 6 : 10;
  const fw = Math.min(92, (vw - 48 - (n - 1) * gap) / n);
  const x0 = (vw - (n * fw + (n - 1) * gap)) / 2;
  const rects = gcards.map(c => c.getBoundingClientRect());
  const scales = rects.map(r => fw / r.width);
  const H = Math.max(...rects.map((r, i) => r.height * scales[i]));
  const top = innerHeight * .42 - H / 2;
  reel.style.left = (x0 - 14) + 'px';
  reel.style.width = (n * fw + (n - 1) * gap + 28) + 'px';
  reel.style.top = (top - 18) + 'px';
  reel.style.height = (H + 36) + 'px';
  return rects.map((r, i) => `translate(${x0 + i * (fw + gap) - r.left}px, ${top - r.top}px) scale(${scales[i]})`);
}

const carouselParts = () => [document.querySelector('.stage'), document.querySelector('.controls'), dots, descEl];
const clearAnims = () => { [...gcards, reel, ...carouselParts()].forEach(e => e.getAnimations().forEach(a => a.cancel())); };

async function morphView(to) {
  if (viewBusy) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { setView(to, true); return; }
  viewBusy = true;
  document.body.classList.add('animating');
  try {
    const n = gcards.length;
    if (to === 'grid') {
      // 1. karuzela znika
      await Promise.all(carouselParts().map(e => fin(e.animate(
        [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.94)' }],
        { duration: 200, easing: 'ease-in', fill: 'forwards' }))));
      setView('grid', true);
      clearAnims();
      // 2. klatki pojawiają się w taśmie, potem rozwijają się na swoje miejsca w siatce
      const strips = stripFrames();
      const T = T_APPEAR + (n - 1) * T_STAG + T_FLY;
      reel.hidden = false;
      reel.animate([
        { opacity: 0, transform: 'scaleX(.7)' },
        { opacity: 1, transform: 'scaleX(1)', offset: T_APPEAR / T },
        { opacity: 1, transform: 'scaleX(1)', offset: (T_APPEAR + T_FLY * .35) / T },
        { opacity: 0, transform: 'scaleX(1)' }
      ], { duration: T, easing: 'ease-out' });
      await Promise.all(gcards.map((c, i) => {
        const leave = T_APPEAR + i * T_STAG;
        return fin(c.animate([
          { transform: strips[i], opacity: 0, easing: 'ease-out' },
          { transform: strips[i], opacity: 1, offset: T_APPEAR / T },
          { transform: strips[i], opacity: 1, offset: leave / T, easing: FLY_EASE },
          { transform: 'none', opacity: 1, offset: (leave + T_FLY) / T },
          { transform: 'none', opacity: 1 }
        ], { duration: T }));
      }));
      reel.hidden = true;
    } else {
      // 1. kafelki zwijają się w taśmę
      const strips = stripFrames();
      const T = (n - 1) * T_STAG + T_FLY + T_HOLD + T_OUT;
      reel.hidden = false;
      reel.animate([
        { opacity: 0, transform: 'scaleX(.7)' },
        { opacity: 1, transform: 'scaleX(1)', offset: T_FLY * .6 / T },
        { opacity: 1, transform: 'scaleX(1)', offset: (T - T_OUT) / T },
        { opacity: 0, transform: 'scaleX(1)' }
      ], { duration: T, easing: 'ease-out' });
      await Promise.all(gcards.map((c, i) => {
        const start = i * T_STAG;
        return fin(c.animate([
          { transform: 'none', opacity: 1, easing: FOLD_EASE },
          { transform: 'none', opacity: 1, offset: start / T, easing: FOLD_EASE },
          { transform: strips[i], opacity: 1, offset: (start + T_FLY) / T },
          { transform: strips[i], opacity: 1, offset: (T - T_OUT) / T },
          { transform: strips[i], opacity: 0 }
        ], { duration: T, fill: 'forwards' }));
      }));
      reel.hidden = true;
      // 2. taśma znika, wchodzi karuzela
      setView('carousel', true);
      clearAnims();
      await Promise.all(carouselParts().map(e => fin(e.animate(
        [{ opacity: 0, transform: 'scale(.94)' }, { opacity: 1, transform: 'scale(1)' }],
        { duration: 320, easing: FLY_EASE }))));
    }
  } finally {
    clearAnims();
    reel.hidden = true;
    document.body.classList.remove('animating');
    viewBusy = false;
  }
}

viewbtn.addEventListener('click', e => {
  if (viewBusy) return;
  sfx.swap();
  morphView(view === 'grid' ? 'carousel' : 'grid');
  dropFocus(e);
});

// Najkrótsza odległość ze znakiem na zapętlonej liście.
function offset(i) {
  let d = ((i - active) % n + n) % n;
  if (d > n / 2) d -= n;
  return d;
}

function layout(announce) {
  cards.forEach((el, i) => {
    const d = offset(i), a = Math.min(Math.abs(d), 3), s = Math.sign(d);
    el.dataset.pos = a;
    el.classList.toggle('is-active', d === 0);
    el.style.setProperty('--x', s * SHIFT[a]);
    el.style.setProperty('--a', a);
    el.style.setProperty('--ry', (-s * 32) + 'deg');
    el.style.setProperty('--s', SCALE[a]);
    el.style.setProperty('--o', ALPHA[a]);
    el.tabIndex = a > 2 ? -1 : 0;
    el.toggleAttribute('aria-hidden', a > 2);
    el.setAttribute('aria-current', d === 0 ? 'true' : 'false');
  });
  dotEls.forEach((el, i) => el.setAttribute('aria-current', i === active ? 'true' : 'false'));

  const g = GAMES[active];
  document.body.style.setProperty('--accent', g.accent || '#C9A85C');
  briefEls.forEach((el, i) => el.classList.toggle('on', i === active));
  cta.innerHTML = g.href
    ? `<a class="play" href="${esc(g.href)}">Graj <span class="arr" aria-hidden="true">→</span></a>`
    : '<span class="soon-badge">Wkrótce</span>';

  if (announce) live.textContent = `${g.title}, ${active + 1} z ${n}${g.href ? '' : ', niedostępna'}`;
}

function go(i) {
  active = ((i % n) + n) % n;
  sfx.tick();
  layout(true);
}

function launch(idx) {
  const g = GAMES[idx === undefined ? active : idx];
  if (!g.href) { sfx.error(); return; }
  sfx.launch();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { location.href = g.href; return; }
  document.body.classList.add('leaving');
  if (view === 'grid' && idx !== undefined) gcards[idx].classList.add('go');
  setTimeout(() => { location.href = g.href; }, 260);
}
addEventListener('pageshow', () => { document.body.classList.remove('leaving'); gcards.forEach(c => c.classList.remove('go')); });

// Kliknięcie myszą/palcem zdejmuje fokus z przycisku, żeby Enter dalej uruchamiał grę.
const dropFocus = e => { if (e.detail > 0) e.currentTarget.blur(); };

let swiped = false;
// Klik w scenę: środkowy kafelek uruchamia grę, w resztę scen wybiera widoczny kafelek
// o najbliższym środku (nakładające się kafelki dzielą pole po połowie),
// a puste pole poza kafelkami przesuwa o jeden.
stage.addEventListener('click', e => {
  if (swiped) return;
  const hit = e.target.closest('.card');
  if (hit && +hit.dataset.i === active) { launch(); return; }
  const r0 = cards[active].getBoundingClientRect();
  if (e.clientX >= r0.left && e.clientX <= r0.right && e.clientY >= r0.top && e.clientY <= r0.bottom) { launch(); return; }
  let best = -1, bd = 1e9;
  cards.forEach((c, i) => {
    if (i === active || +c.dataset.pos > 2) return;
    const r = c.getBoundingClientRect();
    if (e.clientY < r.top || e.clientY > r.bottom) return;
    if (e.clientX < r.left || e.clientX > r.right) return;
    const d = Math.abs(e.clientX - (r.left + r.right) / 2);
    if (d < bd) { bd = d; best = i; }
  });
  if (best >= 0) { go(best); return; }
  const cx = (r0.left + r0.right) / 2;
  go(active + (e.clientX < cx ? -1 : 1));
});
grid.addEventListener('click', e => {
  const c = e.target.closest('.gcard');
  if (!c) return;
  const i = +c.dataset.i;
  active = i; layout(false);
  launch(i);
});
$('prev').addEventListener('click', e => { go(active - 1); dropFocus(e); });
$('next').addEventListener('click', e => { go(active + 1); dropFocus(e); });
dots.addEventListener('click', e => {
  const d = e.target.closest('.dot');
  if (!d) return;
  go(+d.dataset.i);
  if (e.detail > 0) d.blur();
});
cta.addEventListener('click', e => {
  if (e.target.closest('.play') && !e.ctrlKey && !e.metaKey && !e.shiftKey && e.button === 0) {
    e.preventDefault();
    launch();
  }
});

// Siatka: strzałki, Home/End. Pion wybiera najbliższą kartę w sąsiednim rzędzie.
function gridKey(e) {
  const keys = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'];
  if (!keys.includes(e.key)) return;
  e.preventDefault();
  const cur = Math.max(0, gcards.indexOf(document.activeElement));
  let next = cur;
  if (e.key === 'Home') next = 0;
  else if (e.key === 'End') next = gcards.length - 1;
  else if (e.key === 'ArrowLeft') next = Math.max(0, cur - 1);
  else if (e.key === 'ArrowRight') next = Math.min(gcards.length - 1, cur + 1);
  else {
    const dir = e.key === 'ArrowDown' ? 1 : -1, r0 = gcards[cur].getBoundingClientRect();
    let best = null, bd = 1e9;
    gcards.forEach((c, i) => {
      const r = c.getBoundingClientRect();
      if (dir * (r.top - r0.top) < 4) return;
      const d = Math.abs(r.top - r0.top) * 4 + Math.abs(r.left - r0.left);
      if (d < bd) { bd = d; best = i; }
    });
    if (best !== null) next = best;
  }
  if (next !== cur || document.activeElement !== gcards[cur]) { gcards[next].focus(); sfx.swap(); }
}

document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const t = e.target;
  if (t.closest && t.closest('input, textarea, select, [contenteditable]')) return;
  if (view === 'grid') { gridKey(e); return; }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); go(active - 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go(active + 1); }
  // Enter na przycisku/linku robi to, co ten element; poza nimi uruchamia grę ze środka.
  else if (e.key === 'Enter' && !t.closest('button, a')) { e.preventDefault(); launch(); }
});

// Swipe palcem
let sx = null, sy = 0;
stage.addEventListener('touchstart', e => {
  const t = e.touches[0];
  sx = t.clientX; sy = t.clientY;
}, { passive: true });
stage.addEventListener('touchend', e => {
  if (sx === null) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  sx = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2) {
    swiped = true;
    go(active + (dx < 0 ? 1 : -1));
    setTimeout(() => { swiped = false; }, 400);
  }
}, { passive: true });

// ---------- dołączanie kodem pokoju ----------
const joinform = $('joinform'), joincode = $('joincode'), joinerr = $('joinerr'), joinpick = $('joinpick');
joincode.addEventListener('input', () => {
  const v = joincode.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (v !== joincode.value) joincode.value = v;
  joinerr.textContent = ''; joinpick.hidden = true;
});
joinform.addEventListener('submit', e => {
  e.preventDefault();
  const c = joincode.value.trim().toUpperCase();
  if (!/^[A-Z0-9]{5}$/.test(c)) { joinerr.textContent = 'Kod pokoju ma 5 znaków.'; sfx.error(); joincode.focus(); return; }
  const cur = GAMES[active].title;
  joinpick.innerHTML = '<p>Do której gry należy kod <b>' + esc(c) + '</b>?</p>' +
    JOIN.map((j, i) => `<button type="button" data-j="${i}"${view === 'carousel' && j.game === cur ? ' class="sug"' : ''}>${esc(j.name)}</button>`).join('');
  joinpick.hidden = false;
  sfx.swap();
  const sug = joinpick.querySelector('.sug') || joinpick.querySelector('button');
  if (sug) sug.focus();
});
joinpick.addEventListener('click', e => {
  const b = e.target.closest('button[data-j]');
  if (!b) return;
  const c = joincode.value.trim().toUpperCase();
  if (!/^[A-Z0-9]{5}$/.test(c)) return;
  sfx.launch();
  location.href = JOIN[+b.dataset.j].url(c);
});

setView(view, false);
layout(false);
</script>
<script>
/* Skaner kodów QR. Systemowy aparat otwiera link w przeglądarce, a ten skaner otwiera go wewnątrz aplikacji PL3Y
   (z ekranu głównego). Dekodowanie: BarcodeDetector (Android/Chrome), a w Safari jsQR z /vendor/jsQR.js (ładowany dopiero tu).
   Przyjmuje tylko adresy PL3Y i otwiera je pod bieżącym adresem strony, żeby zostać w aplikacji. */
(function () {
  const HOSTS = ['pl3y.pl', 'www.pl3y.pl', 'egozaur.github.io'];
  // Tekst z kodu QR → adres do otwarcia albo null (obcy kod).
  function target(text) {
    try {
      const u = new URL(String(text).trim());
      if (u.protocol !== 'https:' && u.protocol !== 'http:') return null;
      if (!HOSTS.includes(u.hostname) && u.host !== location.host) return null;
      return location.origin + u.pathname + u.search + u.hash;
    } catch (e) { return null; }
  }
  window.PL3Y_SCAN = { target };

  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) return;
  // przycisk tylko na telefonach i tabletach (na komputerze nie ma czego skanować); ?scan wymusza go do testów
  if (!matchMedia('(pointer: coarse)').matches && !/[?&]scan\b/.test(location.search)) return;

  const btn = document.getElementById('scan'), ov = document.getElementById('scanov');
  const vid = document.getElementById('scanvid'), msg = document.getElementById('scanmsg');
  const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  let stream = null, timer = null, detector = null, busy = false;
  btn.hidden = false;

  async function decoder() {
    if (detector || window.jsQR) return;
    if ('BarcodeDetector' in window) {
      try {
        if ((await BarcodeDetector.getSupportedFormats()).includes('qr_code')) { detector = new BarcodeDetector({ formats: ['qr_code'] }); return; }
      } catch (e) {}
    }
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = '/vendor/jsQR.js'; s.onload = res; s.onerror = () => rej(new Error('jsqr'));
      document.head.appendChild(s);
    });
  }

  async function frame() {
    if (!stream || busy || vid.readyState < 2) return;
    busy = true;
    try {
      let text = null;
      if (detector) {
        const r = await detector.detect(vid);
        if (r.length) text = r[0].rawValue;
      } else {
        const w = vid.videoWidth, h = vid.videoHeight, k = Math.min(1, 640 / Math.max(w, h));
        canvas.width = Math.round(w * k); canvas.height = Math.round(h * k);
        ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
        const d = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const r = window.jsQR(d.data, d.width, d.height, { inversionAttempts: 'dontInvert' });
        if (r) text = r.data;
      }
      if (text) found(text);
    } catch (e) {} finally { busy = false; }
  }

  function found(text) {
    const url = target(text);
    if (!url) { msg.textContent = 'To nie jest kod PL3Y. Zeskanuj kod z ekranu gry.'; return; }
    msg.textContent = 'Otwieram…';
    stop(false);
    location.href = url;
  }

  async function open() {
    ov.hidden = false;
    msg.textContent = 'Uruchamiam aparat…';
    try {
      await decoder();
      stream = await md.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      vid.srcObject = stream;
      await vid.play();
      msg.textContent = 'Skieruj aparat na kod QR z ekranu gry.';
      timer = setInterval(frame, 150);
    } catch (e) {
      stop(false);
      msg.textContent = e && e.name === 'NotAllowedError'
        ? 'Brak dostępu do aparatu. Zezwól na niego w Ustawieniach telefonu (iPhone: Ustawienia → Safari → Aparat) i spróbuj ponownie.'
        : 'Nie udało się uruchomić aparatu.';
    }
  }

  function stop(hide = true) {
    clearInterval(timer); timer = null;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    vid.srcObject = null;
    if (hide) ov.hidden = true;
  }

  btn.addEventListener('click', open);
  document.getElementById('scanclose').addEventListener('click', () => stop());
  document.addEventListener('visibilitychange', () => { if (document.hidden && !ov.hidden) stop(); });
  // klawisze karuzeli nie działają pod otwartym skanerem; Escape zamyka
  document.addEventListener('keydown', e => {
    if (ov.hidden) return;
    e.stopPropagation();
    if (e.key === 'Escape') stop();
  }, true);
})();
</script>
</body>
